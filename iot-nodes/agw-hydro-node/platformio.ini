; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:agw-hydro-01]
platform = espressif32
board = esp32dev
framework = arduino
; 115200 en vez de 9600: a 9600 los logs de arranque se truncan y el
; monitor serie va a tirones. Debe coincidir con Serial.begin() en main.cpp.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
	bblanchon/ArduinoJson          @ ^6.21.4
	paulstoffregen/OneWire         @ ^2.3.7
	milesburton/DallasTemperature  @ ^3.11.0
	closedcube/ClosedCube HDC1080  @ ^1.3.2
	knolleary/PubSubClient@^2.8
build_flags =
	-DCORE_DEBUG_LEVEL=3

; ============================================================
;  Nodo 2 — cultivo de lechuga, solo hidroponia
; ============================================================
;  Comparte codigo, secrets.h y librerias con el nodo 1. Todo lo que
;  cambia son estos flags: no hay un segundo config.h que mantener en
;  paralelo, que es como acaban divergiendo los dos nodos.
;
;  SUS DATOS SON SINTETICOS. El modulo `simulacion` genera los valores
;  de los sensores dentro del propio ESP32, asi que este nodo no
;  necesita ningun sensor conectado. Va marcado como tal en la nube:
;  mezclar tramas sinteticas con las reales corrompe las metricas de
;  telecomunicaciones del §9, que es justo el resultado que el proyecto
;  defiende.
;
;  Los relés tampoco existen aqui: `riego_hidro` sigue encendido para
;  que el nodo genere sus eventos de ciclo, pero no hay nada conectado
;  a los GPIO. `ambiente`, `riego_tierra` y `sensor_suelo` van apagados
;  porque este cultivo es solo hidroponia.
;
;  Para subirlo:  pio run -e agw-sim-02 -t upload
;
[env:agw-sim-02]
extends = env:agw-hydro-01
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DDEVICE_ID='"IoT-node-26.002"'
	-DDEVICE_TYPE='"hydro-sim"'
	-DTOPIC_BASE='"cultivo/indoor/lechuga"'
	-DMQTT_CLIENT_ID_PUB='"agw-lechuga-pub-02"'
	-DMQTT_CLIENT_ID_SUB='"agw-lechuga-sub-02"'
	-DDEFAULT_MOD_SIMULACION=true
	-DDEFAULT_MOD_RIEGO_TIERRA=false
	-DDEFAULT_MOD_SENSOR_SUELO=false
	-DDEFAULT_MOD_AMBIENTE=false
