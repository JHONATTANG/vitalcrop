; ============================================================
;  AGW SimNode — segundo nodo, datos sinteticos
; ============================================================
;  Proyecto independiente del nodo 1 (../agw-hydro-node). Comparten
;  origen pero no ficheros: lo que se toque aqui no puede llegar al
;  cultivo real.
;
;  Subir:   pio run -e agw-sim-02 -t upload
;
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:agw-sim-02]
platform = espressif32
board = esp32dev
framework = arduino
; 115200 en vez de 9600: a 9600 los logs de arranque se truncan y el
; monitor serie va a tirones. Debe coincidir con Serial.begin() en main.cpp.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
	bblanchon/ArduinoJson          @ ^6.21.4
	paulstoffregen/OneWire         @ ^2.3.7
	milesburton/DallasTemperature  @ ^3.11.0
	closedcube/ClosedCube HDC1080  @ ^1.3.2
	knolleary/PubSubClient@^2.8
build_flags =
	-DCORE_DEBUG_LEVEL=3
