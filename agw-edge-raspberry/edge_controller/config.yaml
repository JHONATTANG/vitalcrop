device:
  gateway_id: "FOG_RPI_HIERBABUENA_01"   # = gateways.gateway_id en Neon
  location: "Cultivo Indoor Hierbabuena"
  firmware_version: "1.0.0"

mqtt:
  # Broker Mosquitto local. Puerto 1883 — el mismo que MQTT_PORT del
  # firmware (iot-nodes/agw-hydro-node/include/config.h).
  broker_host: "127.0.0.1"
  broker_port: 1883
  username: ""            # allow_anonymous true en Fases 2-5
  password: ""
  keepalive: 60
  qos: 1                  # "at least once" — comprometido en el anteproyecto
  reconnect_interval: 5
  max_reconnect_delay: 60

cloud:
  # ⚠️ No hay API desplegada. Durante la Fase 3 apuntar a la IP LAN del PC
  # de desarrollo, con uvicorn levantado con --host 0.0.0.0
  enabled: false
  api_base_url: "http://192.168.20.10:8000"
  api_key: "CAMBIAR"                           # override: AGW_CLOUD_API_KEY
  telemetry_endpoint: "/api/telemetria"        # contrato real (MCD §4.2)
  health_endpoint: "/api/health"
  commands_endpoint: "/api/commands/pending"   # aún no existe (deuda 7.10)
  poll_interval_seconds: 5
  push_timeout_seconds: 10
  retry_max: 3
  batch_size: 50

storage:
  db_path: "/var/lib/agw/buffer.db"
  max_buffered_records: 50000    # ~5 meses a 1 lectura cada 5 min

programa:
  # Programa de cultivo que el gateway empuja al nodo al arrancar y cada
  # vez que lo saca del modo degradado. Es la fuente de verdad: lo que se
  # cambie solo en el ESP32 vuelve a este valor en el siguiente reinicio
  # del gateway.
  hora_luz_on: 6
  hora_luz_off: 20
  # Hidroponía. El ciclo es RIEGO + DESCANSO, y de ahí sale la cadencia:
  #   día    300 + 600  =  900 s = 15 min  ->  4 riegos por hora
  #   noche  300 + 3300 = 3600 s = 60 min  ->  1 riego por hora
  # Cambiar uno sin el otro descuadra la cadencia.
  hidro_riego_dia_s: 300
  hidro_descanso_dia_s: 600
  hidro_riego_noche_s: 300
  hidro_descanso_noche_s: 3300
  # REGLA: la tierra se llena hasta que el sensor de nivel acusa el agua,
  # y eso se repite cada N días. 10 es lo acordado para la hierbabuena;
  # bajar a 8-9 en épocas de calor, subir a 12-13 en invierno.
  # Tras cambiarlo:  sudo systemctl restart agw-edge
  tierra_cada_dias: 10
  tierra_hora: 7
  telemetria_s: 60

rules:
  enabled: true
  rules_file: "./rules/rules.yaml"

ap_watcher:
  # Vigila las asociaciones del punto de acceso. Cuando el ESP32 se va
  # del WiFi y vuelve, se le repone hora y programa al instante, sin
  # esperar a que lo confiese en su heartbeat ni al resync horario.
  enabled: true
  interface: "wlan0"
  # MAC del nodo IoT-node-26.001. Vacío = cualquier estación que entre.
  node_mac: "38:18:2b:8a:12:7c"
  poll_seconds: 10
  # Segundos entre la asociación y el envío: el nodo aún tiene que coger
  # IP, conectar al broker y suscribirse al topic de comandos.
  settle_seconds: 8

health:
  enabled: true
  host: "0.0.0.0"
  port: 8080
