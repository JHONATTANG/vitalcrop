# dnsmasq configuration — AGW DHCP + DNS server
# AGW Edge Gateway — VitalCrop
# Sirve DHCP solo en la interfaz IoT (wlan1 → 10.10.0.0/24)

# Solo escuchar en wlan1
interface=wlan1
bind-interfaces

# Rango DHCP: .10 a .50, lease 24h
dhcp-range=10.10.0.10,10.10.0.50,255.255.255.0,24h

# Gateway (el propio Edge)
dhcp-option=3,10.10.0.1

# DNS (el propio Edge redirecciona a Google)
dhcp-option=6,10.10.0.1
server=8.8.8.8
server=8.8.4.4

# Hostname local del gateway
address=/agw.local/10.10.0.1

# Logging
log-queries
log-dhcp

# No usar /etc/resolv.conf del sistema
no-resolv
