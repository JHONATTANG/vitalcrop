# hostapd configuration — AGW IoT Access Point (wlan1)
# AGW Edge Gateway — VitalCrop

interface=wlan1
driver=nl80211

# SSID de la red IoT
ssid=AGW_IOT_NET
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0

# Open broadcast (ESP32s deben conocer el SSID)
ignore_broadcast_ssid=0

# Autenticación WPA2-PSK
auth_algs=1
wpa=2
wpa_passphrase=AgwIoT2024!
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Control interface (para hostapd_cli)
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
